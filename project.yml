name: HealthMap

options:
  bundleIdPrefix: fr.healthmap
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ANALYZER_NONNULL: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

targets:
  HealthMap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthMap
        excludes:
          - "Resources/Config.xcconfig"
          - "Resources/Config.xcconfig.example"
          - "Resources/Info.plist"
      # Ce que l'app et les widgets se partagent (données du jour, liens,
      # gestes, vues) : compilé dans les deux cibles.
      - path: Partage
    configFiles:
      Debug: HealthMap/Resources/Config.xcconfig
      Release: HealthMap/Resources/Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.healthmap.app
        PRODUCT_NAME: HealthMap
        INFOPLIST_FILE: HealthMap/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthMap/Resources/HealthMap.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D87R3L7B75
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "2.0.1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # `Partage/` est compilé dans l'app ET dans l'extension : ce drapeau
        # dit au code partagé qu'il tourne dans l'app (`#if KIWIO_APP`).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KIWIO_APP"
      configs:
        Release:
          # Manual signing scoped to the APP TARGET + Release config ONLY.
          # Passing these globally via gym xcargs also hit the SPM package
          # targets (RevenueCat, swift-crypto...) which "do not support
          # provisioning profiles" -> archive error (exit 65). Per-target +
          # per-config keeps Debug/simulator tests on Automatic and signs only
          # the app for App Store distribution. The match profile name is
          # deterministic ("match <Type> <bundle_id>").
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore fr.healthmap.app"
    entitlements:
      path: HealthMap/Resources/HealthMap.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: production
        com.apple.developer.associated-domains:
          - applinks:healthmap.fr
        com.apple.developer.healthkit: true
        # Trousseau partagé avec les widgets (`BoiteCommune`). Le PREMIER
        # groupe est le groupe par défaut des nouvelles entrées : il doit
        # rester celui de l'app (identique à son `application-identifier`),
        # sinon la session Supabase changerait de groupe et serait lisible
        # par l'extension. Ne pas inverser les deux lignes.
        keychain-access-groups:
          - $(AppIdentifierPrefix)fr.healthmap.app
          - $(AppIdentifierPrefix)fr.healthmap.app.partage
    dependencies:
      # L'extension de widgets, embarquée dans l'app (PlugIns/).
      - target: KiwioWidgets
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: Sentry
        product: Sentry

  # ── Widgets (écran d'accueil, écran verrouillé, activité en direct) ───────
  # Aucune dépendance SPM, aucun secret : l'extension ne lit que la boîte
  # commune (trousseau partagé) que l'app remplit. Le signe Kiwio vient du
  # MÊME fichier que dans l'app.
  KiwioWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KiwioWidgets
        excludes:
          - "Info.plist"
      - path: Partage
      - path: HealthMap/Views/Shared/KiwiSigne.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.healthmap.app.widgets
        PRODUCT_NAME: KiwioWidgets
        INFOPLIST_FILE: KiwioWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: KiwioWidgets/KiwioWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D87R3L7B75
        # Même indentation que celle de l'app : la CI réécrit les DEUX lignes
        # d'un seul `sed` (Apple refuse une extension dont le numéro de build
        # diffère de celui de l'app).
        CURRENT_PROJECT_VERSION: 1
        # À bumper EN MÊME TEMPS que celle de l'app (`WidgetsPartageTests`
        # échoue si les deux divergent).
        MARKETING_VERSION: "2.0.1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Release:
          # Même schéma que l'app : signature manuelle en Release seulement,
          # avec le profil match de l'extension.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore fr.healthmap.app.widgets"
    entitlements:
      path: KiwioWidgets/KiwioWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)fr.healthmap.app.partage

  HealthMapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthMapTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.healthmap.app.tests
        PRODUCT_NAME: HealthMapTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HealthMap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HealthMap"
    dependencies:
      - target: HealthMap

  HealthMapUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthMapUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.healthmap.app.uitests
        PRODUCT_NAME: HealthMapUITests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HealthMap
    dependencies:
      - target: HealthMap

schemes:
  # Captures d'écran (workflow screenshots.yml) : un scheme à part, pour que
  # le scheme `HealthMap` (gate de PR) ne lance jamais les tests UI.
  HealthMapScreenshots:
    build:
      targets:
        HealthMap: all
        HealthMapUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthMapUITests
  HealthMap:
    build:
      targets:
        HealthMap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthMapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HealthMapTests:
    build:
      targets:
        HealthMapTests: [test]
    test:
      config: Debug
      targets:
        - HealthMapTests
