name: HealthMap

options:
  bundleIdPrefix: fr.healthmap
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ANALYZER_NONNULL: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    branch: main
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

targets:
  HealthMap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthMap
        excludes:
          - "Resources/Config.xcconfig"
          - "Resources/Config.xcconfig.example"
          - "Resources/Info.plist"
    configFiles:
      Debug: HealthMap/Resources/Config.xcconfig
      Release: HealthMap/Resources/Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.healthmap.app
        PRODUCT_NAME: HealthMap
        INFOPLIST_FILE: HealthMap/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthMap/Resources/HealthMap.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D87R3L7B75
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    entitlements:
      path: HealthMap/Resources/HealthMap.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:healthmap.fr
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: Sentry
        product: Sentry

  HealthMapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthMapTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.healthmap.app.tests
        PRODUCT_NAME: HealthMapTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HealthMap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HealthMap"
    dependencies:
      - target: HealthMap

schemes:
  HealthMap:
    build:
      targets:
        HealthMap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthMapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HealthMapTests:
    build:
      targets:
        HealthMapTests: [test]
    test:
      config: Debug
      targets:
        - HealthMapTests
