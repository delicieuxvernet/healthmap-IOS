name: Build & Deploy to TestFlight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger (recommended for the FIRST run)

jobs:
  # ── Tests (gate de PR) ──────────────────────────────────────────────────
  # Tourne sur chaque pull request : compile l'app + la suite de tests sur
  # simulateur (aucune signature, aucun secret Apple requis). BLOQUANT : une
  # PR avec tests rouges ne doit pas être mergée. Le déploiement TestFlight
  # (job ci-dessous) reste réservé aux pushes sur main — il n'est pas ralenti.
  tests:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 40

    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject Config.xcconfig
        env:
          CONFIG_XCCONFIG_BASE64: ${{ secrets.CONFIG_XCCONFIG_BASE64 }}
        run: |
          mkdir -p HealthMap/Resources
          echo -n "$CONFIG_XCCONFIG_BASE64" | base64 --decode > HealthMap/Resources/Config.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HealthMap.xcodeproj \
            -scheme HealthMap

      # timeout strict par test : un test qui hang (ex. appel réseau réel
      # sans timeout) fait échouer la suite au lieu de bloquer le runner.
      - name: Run tests
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild test \
            -project HealthMap.xcodeproj \
            -scheme HealthMap \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: warn

  # ── Build + déploiement TestFlight (pushes sur main uniquement) ─────────
  build-and-upload:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      # gym runs `xcodebuild -showBuildSettings` to read build settings; with 12
      # SPM deps (RevenueCat/Supabase/Clerk/Sentry...) + Xcode 26.2 this exceeds
      # fastlane's 3s default (4 retries, ~24s max) and aborts build_app. Give it
      # generous headroom so the archive/export actually runs.
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH for match (certs repo)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Trust github.com host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      # iOS 26 SDK / Xcode 26 is mandatory for App Store Connect uploads since
      # 2026-04-28. Xcode 26.2 is preinstalled on the current macos-15 image.
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject Config.xcconfig
        env:
          CONFIG_XCCONFIG_BASE64: ${{ secrets.CONFIG_XCCONFIG_BASE64 }}
        run: |
          mkdir -p HealthMap/Resources
          echo -n "$CONFIG_XCCONFIG_BASE64" | base64 --decode > HealthMap/Resources/Config.xcconfig

      # Use github.run_number as the build number so every push gets a unique
      # CURRENT_PROJECT_VERSION. Without this, the second push fails the
      # TestFlight upload with "build 1.0.0 (1) already exists" — Apple refuses
      # to accept the same MARKETING_VERSION + CURRENT_PROJECT_VERSION twice.
      # github.run_number is monotonically increasing per workflow, never reused.
      - name: Bump CURRENT_PROJECT_VERSION to github.run_number
        run: |
          sed -i.bak "s/^        CURRENT_PROJECT_VERSION: .*/        CURRENT_PROJECT_VERSION: ${{ github.run_number }}/" project.yml
          rm -f project.yml.bak
          echo "Build number set to: ${{ github.run_number }}"
          grep "CURRENT_PROJECT_VERSION" project.yml

      # .xcodeproj is NOT committed (XcodeGen-generated). Regenerate so the build
      # always matches project.yml (the source of truth).
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HealthMap.xcodeproj \
            -scheme HealthMap

      # Les tests tournent désormais dans le job `tests` sur chaque pull
      # request (gate bloquante) — le déploiement main reste rapide.
      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Install fastlane
        # Pin fastlane to the known-good build (2.235.0 ran the lane in PR #5) and
        # install multi_json explicitly: fastlane's action loader `require`s it
        # (via representable/json in google-apis-core) but no gem in the tree
        # declares it as a hard dep on Ruby 3.4, so plain `gem install fastlane`
        # can omit it -> "Could not find 'multi_json'" crash at startup.
        run: gem install fastlane:2.235.0 multi_json --no-document

      - name: Build & upload to TestFlight (fastlane)
        run: fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthMap-ipa
          path: build/HealthMap.ipa
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
# PREREQUISITES (set as GitHub repo secrets BEFORE first push; first run via
# workflow_dispatch). The old manual-signing secrets
# (BUILD_CERTIFICATE_BASE64 / P12_PASSWORD / BUILD_PROVISION_PROFILE_BASE64 /
# KEYCHAIN_PASSWORD) are no longer used — match replaces them.
#   - ASC_KEY_ID / ASC_ISSUER_ID / ASC_API_KEY_BASE64  (App Store Connect API
#       key — must be a TEAM key with ADMIN role; Individual keys and
#       App Manager role CANNOT create/manage signing assets)
#   - MATCH_GIT_URL        (private git repo storing match certs/profiles)
#   - MATCH_PASSWORD       (match encryption passphrase)
#   - FASTLANE_TEAM_ID     (10-char Apple Developer Team ID owning fr.healthmap.app)
#   - CONFIG_XCCONFIG_BASE64  (base64 of the real Config.xcconfig)
# The app record for fr.healthmap.app must already exist in App Store Connect
# (pilot uploads to it, it does not create it). A fresh Apple account may need
# 24-48h after activation before signing/Provisioning endpoints respond.
# ─────────────────────────────────────────────────────────────────────────────
