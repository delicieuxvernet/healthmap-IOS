# Pilote les abonnements App Store (prix, localisations, disponibilité, essai)
# via l'API App Store Connect — l'UI web n'est pas automatisable (shadow DOM)
# et un accord en attente (ex. DSA) y bloque l'enregistrement sans message.
# Réutilise les secrets ASC déjà en place pour TestFlight.
name: ASC Subscriptions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit/app-audit = lecture seule | apply = fixe prix/localisation/disponibilité/essai"
        required: true
        default: audit
        type: choice
        options: [audit, apply, app-audit]

permissions:
  contents: read

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write ASC API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: echo -n "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

      - name: Install jwt gem
        run: sudo gem install jwt --no-document

      # Screenshot review (visible uniquement par App Review) : requis pour
      # sortir de l'état MISSING_METADATA, rendu depuis le SVG du repo.
      - name: Render review screenshot
        if: inputs.mode == 'apply'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1284 -h 2778 scripts/asc_review_screenshot.svg -o "$RUNNER_TEMP/kiwio-paywall-review.png"
          ls -la "$RUNNER_TEMP/kiwio-paywall-review.png"

      - name: Run (${{ inputs.mode }})
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          REVIEW_SCREENSHOT_PATH: ${{ runner.temp }}/kiwio-paywall-review.png
          MODE: ${{ inputs.mode }}
        run: ruby scripts/asc_subscriptions.rb
