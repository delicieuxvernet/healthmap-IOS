# Pilote les abonnements App Store (prix, localisations, disponibilité, essai)
# via l'API App Store Connect — l'UI web n'est pas automatisable (shadow DOM)
# et un accord en attente (ex. DSA) y bloque l'enregistrement sans message.
# Réutilise les secrets ASC déjà en place pour TestFlight.
name: ASC Subscriptions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit/app-audit = lecture seule | apply = fixe prix/localisation/disponibilité/essai"
        required: true
        default: audit
        type: choice
        options: [audit, apply, app-audit, deep-audit, fix-subs, apply-app, offers, screenshots, submit, fix-meta, attach-video, trim-monthly, cancel-submission, stage-version, stage-subs, send-submission, set-availability, tester-code, new-version]
      display_type:
        description: "screenshots : type d'écran Apple (APP_IPHONE_67 = 1290x2796)"
        required: false
        default: APP_IPHONE_67
        type: string
      only_product:
        description: "apply : ne configurer QUE ce productId (ex. healthmap_weekly ; vide = tous)"
        required: false
        default: ""
        type: string
      stage_only:
        description: "submit : PRÉPARER la soumission (version + abos) sans l'envoyer à Apple"
        required: false
        default: false
        type: boolean
      exclude_products:
        description: "submit : productIds à NE PAS soumettre, séparés par des virgules (ex. healthmap_monthly — abo non affiché par le paywall)"
        required: false
        default: ""
        type: string
      submission_id:
        description: "cancel-submission : id de la reviewSubmission à annuler"
        required: false
        default: ""
        type: string
      video_release_tag:
        description: "attach-video : tag de la release GitHub portant la vidéo sandbox en asset"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write ASC API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: echo -n "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

      - name: Install jwt gem
        run: sudo gem install jwt --no-document

      # Screenshot review (visible uniquement par App Review) : requis pour
      # sortir de l'état MISSING_METADATA, rendu depuis le SVG du repo.
      # Aussi en mode submit : après un refus, re-uploader ce screenshot est
      # le moyen de régénérer une « pending version » soumissible des abos.
      - name: Render review screenshot
        if: contains(fromJSON('["apply", "submit"]'), inputs.mode)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1284 -h 2778 scripts/asc_review_screenshot.svg -o "$RUNNER_TEMP/kiwio-paywall-review.png"
          ls -la "$RUNNER_TEMP/kiwio-paywall-review.png"

      # Vidéo sandbox (attach-video) : l'API workflow_dispatch ne transporte pas
      # de fichier — la vidéo transite par une release GitHub PRIVÉE du repo
      # (asset), téléchargée ici avec le token du job, puis supprimable.
      - name: Download review video
        if: inputs.mode == 'attach-video'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/review-video"
          gh release download "${{ inputs.video_release_tag }}" --dir "$RUNNER_TEMP/review-video" --repo "$GITHUB_REPOSITORY"
          FILE=$(ls "$RUNNER_TEMP/review-video" | head -1)
          test -n "$FILE"
          echo "VIDEO_PATH=$RUNNER_TEMP/review-video/$FILE" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/review-video"

      - name: Run (${{ inputs.mode }})
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          REVIEW_SCREENSHOT_PATH: ${{ runner.temp }}/kiwio-paywall-review.png
          DEMO_ACCOUNT_PASSWORD: ${{ secrets.DEMO_ACCOUNT_PASSWORD }}
          REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
          DISPLAY_TYPE: ${{ inputs.display_type }}
          ONLY_PRODUCT: ${{ inputs.only_product }}
          MODE: ${{ inputs.mode }}
          STAGE_ONLY: ${{ inputs.stage_only && '1' || '0' }}
          EXCLUDE_PRODUCTS: ${{ inputs.exclude_products }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: ruby scripts/asc_subscriptions.rb
